<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Last Bounce</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
    
        <div class="game-container">

            <div id="home-screen">

                <div class="home-logo">
                    <div class="ball-logo">
                        <span></span>
                    </div>
                    <h1 class="game-title">LAST BOUNCE</h1>
                </div>

                <p class="home-subtitle">How long can you survive?</p>

                <div class="home-buttons">
                    <button id="playBtn" class="menu-btn">Play</button>
                    <button id="settingsBtn" class="menu-btn">Settings</button>
                    <button id="howToPlayBtn" class="menu-btn">How To Play</button>
                </div>

                <div id="settings-panel">
                    <button id="closeSettings">X</button>
                    <h2>SETTINGS</h2>
                    
                    <div class="settings-option">
                        <span>Sound</span>
                        <button id="soundToggle" class="toggle-switch">
                            <span class="toggle-circle"></span>
                        </button>
                    </div>
                </div>
            </div>

    <div class="top-bar">

        <div class="score-box">
            <span class="hud-label">Score:</span>
            <span id="score">0</span>
        </div>

        <div class="time-box">
            <span class="hud-label">Time:</span>
            <span id="time">0</span>
        </div>    

        <div class="lives-box">
            <span class="hud-label">Lives:</span>
            <span id="lives">❤️❤️❤️</span>
        </div>

    </div>

    <div id="event-message">
    <div id="event-circle">
        <div id="event-icon">⚡</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

    <div id="game-over">

        <h1>GAME OVER</h1>

        <p>Score: <span id="final-score">0</span></p>

        <p>Time: <span id="final-time">0</span></p>

        <button id="restart-button">PLAY AGAIN</button>

    </div>

</div>

        <script src="script.js"></script>

    </body>
</html>
